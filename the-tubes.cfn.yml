AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 instance running The Tubes server and Traefik with Docker - DNS-01 Challenge for Wildcard SSL with Client IP Control'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcId
          - SubnetId
      - Label:
          default: "DNS Configuration"
        Parameters:
          - HostedZoneId
          - DomainName
          - ServiceName
      - Label:
          default: "Instance Configuration"
        Parameters:
          - InstanceType
          - CreateInstance
          - DockerImage
      - Label:
          default: "Service Configuration"
        Parameters:
          - PublicPort
          - AdminPort
          - DashboardPort
          - SecureTraffic
          - PortRangeStart
          - PortRangeEnd
          - MaxConnectionsPerTunnel
          - ReconnectWindowMs
          - TrustForwardHeaders
          - HttpWaitTimeoutMs
          - WebsocketWaitTimeoutMs
          - RetryAfterSeconds
          - AdminEmail
          - LetsEncryptEnvironment
      - Label:
          default: "Security Configuration"
        Parameters:
          - HmacSecret
          - HmacClockSkewToleranceS
          - AdminToken
          - RateLimitWindowMs
          - RateLimitMaxHits
          - RateLimitBlockDurationMs
    ParameterLabels:
      VpcId:
        default: "VPC ID"
      SubnetId:
        default: "Public Subnet ID"
      HostedZoneId:
        default: "Route53 Hosted Zone ID"
      DomainName:
        default: "Base Domain Name"
      ServiceName:
        default: "Service Name (Subdomain)"
      InstanceType:
        default: "EC2 Instance Type"
      CreateInstance:
        default: "Create EC2 Instance"
      PublicPort:
        default: "The Tubes Public Server Port"
      AdminPort:
        default: "Admin API Port"
      DashboardPort:
        default: "Admin Dashboard Port (Traefik + tt-server)"
      PortRangeStart:
        default: "Expose Client Port Range Start"
      PortRangeEnd:
        default: "Expose Client Port Range End"
      MaxConnectionsPerTunnel:
        default: "Maximum Connections per Tunnel"
      ReconnectWindowMs:
        default: "Tunnel Reconnect Window (ms)"
      TrustForwardHeaders:
        default: "Trust X-Forwarded-For Headers"
      HttpWaitTimeoutMs:
        default: "HTTP Request Timeout (ms)"
      WebsocketWaitTimeoutMs:
        default: "WebSocket Upgrade Timeout (ms)"
      DockerImage:
        default: "The Tubes Docker Image (full reference)"
      RetryAfterSeconds:
        default: "Retry-After Header (seconds)"
      AdminEmail:
        default: "Admin Email for SSL Certificates"
      LetsEncryptEnvironment:
        default: "Lets Encrypt Environment"
      SecureTraffic:
        default: "Secure Traffic with reverse proxy"
      HmacSecret:
        default: "HMAC Shared Secret (optional)"
      HmacClockSkewToleranceS:
        default: "HMAC Clock Skew Tolerance (seconds)"
      AdminToken:
        default: "Admin Dashboard Token (leave empty to auto-generate)"
      RateLimitWindowMs:
        default: "Rate Limit Window (ms)"
      RateLimitMaxHits:
        default: "Rate Limit Max Hits per Window"
      RateLimitBlockDurationMs:
        default: "Rate Limit Block Duration (ms)"

Conditions:
  ShouldCreateInstance: !Equals [!Ref CreateInstance, "true"]
  IsSecureTraffic: !Equals [!Ref SecureTraffic, 'true']
  LetsEncryptEnvironmentIsProduction: !Equals [!Ref LetsEncryptEnvironment, 'production']
  HmacEnabled: !Not [!Equals [!Ref HmacSecret, ""]]
  AdminTokenProvided: !Not [!Equals [!Ref AdminToken, ""]]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the instance will be created

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet ID for the EC2 instance

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
    Description: EC2 instance type

  CreateInstance:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to create the EC2 instance and related resources
    ConstraintDescription: Must be either true or false

  DockerImage:
    Type: String
    Default: ghcr.io/ericchaves/the-tubes:latest
    Description: Full Docker image reference for The Tubes server (e.g., ghcr.io/ericchaves/the-tubes:latest or ghcr.io/ericchaves/the-tubes:v1.2.3)
    AllowedPattern: ^[a-zA-Z0-9._/:@-]+$
    ConstraintDescription: Must be a valid Docker image reference (registry/image:tag)

  PublicPort:
    Type: Number
    Default: 3000
    MinValue: 1024
    MaxValue: 65535
    Description: Port for The Tubes public server to listen on (tunnel traffic forwarded by Traefik)

  AdminPort:
    Type: Number
    Default: 9000
    MinValue: 1024
    MaxValue: 65535
    Description: Port for Admin API - tunnel creation endpoint POST /api/tunnels (restricted by Security Group)
    ConstraintDescription: Must be a valid port number between 1024-65535

  DashboardPort:
    Type: Number
    Default: 9443
    MinValue: 1024
    MaxValue: 65535
    Description: "Port for admin dashboards with HTTPS: Traefik at /dashboard and tt-server admin at /tubes (restricted by Security Group)"
    ConstraintDescription: Must be a valid port number between 1024-65535

  PortRangeStart:
    Type: Number
    Default: 10000
    MinValue: 1024
    MaxValue: 65535
    Description: Start of TCP port range for expose client connections
    ConstraintDescription: Must be a valid port number between 1024-65535

  PortRangeEnd:
    Type: Number
    Default: 10100
    MinValue: 1024
    MaxValue: 65535
    Description: End of TCP port range for expose client connections
    ConstraintDescription: Must be a valid port number between 1024-65535

  MaxConnectionsPerTunnel:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Maximum number of concurrent TCP connections per expose session (TT_MAX_CONNECTIONS_PER_TUNNEL)
    ConstraintDescription: Must be a number between 1 and 100

  ReconnectWindowMs:
    Type: Number
    Default: 180000
    MinValue: 0
    MaxValue: 300000
    Description: How long (ms) a tunnel ID is reserved after the expose client disconnects before the tunnel is destroyed (TT_RECONNECT_WINDOW_MS, max 300000)
    ConstraintDescription: Must be a number between 0 and 300000

  TrustForwardHeaders:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Trust X-Forwarded-For headers for client IP logging when behind Traefik (TT_TRUST_FORWARD_HEADERS)
    ConstraintDescription: Must be either 'true' or 'false'

  HttpWaitTimeoutMs:
    Type: Number
    Default: 5000
    MinValue: 1000
    MaxValue: 30000
    Description: Timeout (ms) to wait for an available tunnel socket before returning 503 to an HTTP request (TT_HTTP_WAIT_TIMEOUT_MS)
    ConstraintDescription: Must be a number between 1000 and 30000

  WebsocketWaitTimeoutMs:
    Type: Number
    Default: 10000
    MinValue: 1000
    MaxValue: 60000
    Description: Timeout (ms) to wait for an available tunnel socket for a WebSocket upgrade (TT_WEBSOCKET_WAIT_TIMEOUT_MS)
    ConstraintDescription: Must be a number between 1000 and 60000

  RetryAfterSeconds:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 60
    Description: Value of the Retry-After header sent with 503 responses when no tunnel socket is available (TT_RETRY_AFTER_SECONDS)
    ConstraintDescription: Must be a number between 1 and 60

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route53 Hosted Zone ID for DNS record creation and DNS-01 challenge

  DomainName:
    Type: String
    Description: Base domain name (e.g., example.com)
    AllowedPattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{1,61}[a-zA-Z0-9]\.[a-zA-Z]{2,}$
    ConstraintDescription: Must be a valid domain name

  ServiceName:
    Type: String
    Default: tt
    Description: Service name used as subdomain (e.g., 'tt' creates tt.example.com as API and *.tt.example.com for tunnels)
    AllowedPattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
    ConstraintDescription: Must be a valid DNS subdomain (lowercase alphanumeric and hyphens)

  AdminEmail:
    Type: String
    AllowedPattern: ^[^@]+@[^@]+\.[^@]+$
    Description: Email address for Lets Encrypt certificate notifications
    ConstraintDescription: Must be a valid email address

  LetsEncryptEnvironment:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - production
    Description: Lets Encrypt environment - staging for testing, production for real certificates (mind rate limits)
    ConstraintDescription: Must be either staging or production

  SecureTraffic:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable HTTPS/SSL via Traefik (true) or use plain HTTP (false). Sets TT_PUBLIC_HTTPS.

  HmacSecret:
    Type: String
    Default: ""
    Description: HMAC-SHA256 shared secret for tunnel creation auth (min 32 chars, leave empty to disable). Generate with - openssl rand -hex 32
    AllowedPattern: ^$|^.{32,}$
    ConstraintDescription: Must be empty or at least 32 characters long

  HmacClockSkewToleranceS:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 600
    Description: "Clock skew tolerance in seconds for HMAC timestamp validation (TT_HMAC_CLOCK_SKEW_TOLERANCE_S). Derived values: nonce max age = 2x this value, nonce cache TTL = 4x this value."
    ConstraintDescription: Must be a number between 10 and 600

  AdminToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: "Admin dashboard token for the tt-server /tubes UI (TT_ADMIN_TOKEN). Leave empty to auto-generate on first start (token is saved to /opt/the-tubes/tt/admin-token). Generate with: openssl rand -hex 32"
    AllowedPattern: ^$|^[A-Za-z0-9_-]{8,}$
    ConstraintDescription: Must be empty or at least 8 alphanumeric characters (a-z, A-Z, 0-9, _, -)

  RateLimitWindowMs:
    Type: Number
    Default: 60000
    MinValue: 1000
    MaxValue: 3600000
    Description: "Sliding window duration (ms) for in-process rate limiting of unknown tunnel probes (TT_RATE_LIMIT_WINDOW_MS)"
    ConstraintDescription: Must be a number between 1000 and 3600000

  RateLimitMaxHits:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 1000
    Description: "Max probe hits per IP within the rate limit window before the IP is temporarily blocked (TT_RATE_LIMIT_MAX_HITS)"
    ConstraintDescription: Must be a number between 1 and 1000

  RateLimitBlockDurationMs:
    Type: Number
    Default: 300000
    MinValue: 1000
    MaxValue: 86400000
    Description: "Duration (ms) an IP is blocked after exceeding RateLimitMaxHits (TT_RATE_LIMIT_BLOCK_DURATION_MS)"
    ConstraintDescription: Must be a number between 1000 and 86400000

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-web-sg'
      GroupDescription: Security group for public HTTP/HTTPS traffic (wildcard tunnel subdomains only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP traffic for public wildcard tunnel subdomains (IPv4)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: ::/0
          Description: HTTP traffic for public wildcard tunnel subdomains (IPv6)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS traffic for public wildcard tunnel subdomains (IPv4)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
          Description: HTTPS traffic for public wildcard tunnel subdomains (IPv6)
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web-sg'

  TheTubesClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-tt-client-sg'
      GroupDescription: Security group for Admin API and expose client port range - Update IPs manually after deployment
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tt-client-sg'

  TraefikDashboardIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TheTubesClientSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DashboardPort
      ToPort: !Ref DashboardPort
      CidrIp: 127.0.0.1/32
      Description: Admin dashboards port (Traefik /dashboard and tt-server /tubes via HTTPS) - Update this IP manually

  AdminApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TheTubesClientSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AdminPort
      ToPort: !Ref AdminPort
      CidrIp: 127.0.0.1/32
      Description: Admin API - POST /api/tunnels for expose clients (HTTPS) - Update this IP manually

  ClientPortRangeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TheTubesClientSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref PortRangeStart
      ToPort: !Ref PortRangeEnd
      CidrIp: 127.0.0.1/32
      Description: TCP port range for expose client persistent connections - Update this IP manually

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: Route53DNSChallenge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource: '*'
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                Resource: !Sub 'arn:aws:route53:::hostedzone/${HostedZoneId}'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2-role'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  TheTubesInstance:
    Type: AWS::EC2::Instance
    Condition: ShouldCreateInstance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT20M
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref WebSecurityGroup
        - !Ref TheTubesClientSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log) 2>&1

          # AL2023 runs dnf-makecache.timer right after boot and holds the RPM lock.
          # wait until the lock is released to prevent dnf race condition
          while pgrep -f dnf > /dev/null; do 
            echo "Waiting DNF lock release..."
            sleep 5
          done

          # Install dependencies
          dnf install -y python3-pip
          pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz
          dnf clean all && dnf update -y && dnf install -y docker
          systemctl start docker && systemctl enable docker
          usermod -a -G docker ec2-user

          # Install Docker Compose
          curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

          # Set variables
          set +e
          CUSTOM_DOMAIN="${ServiceName}.${DomainName}"
          [ "${LetsEncryptEnvironment}" = "production" ] && ACME_SERVER="https://acme-v02.api.letsencrypt.org/directory" || ACME_SERVER="https://acme-staging-v02.api.letsencrypt.org/directory"

          # Create data directory for tt-server persistent state (admin token, blocklist).
          mkdir -p /opt/the-tubes/tt && chmod 777 /opt/the-tubes/tt && cd /opt/the-tubes
          
          # Create docker-compose.yml
          cat > docker-compose.yml << 'COMPOSE_EOF'
          services:
            traefik:
              image: traefik:v3.6.13
              container_name: traefik
              restart: unless-stopped
              networks:
                - tt_net
              command:
                - "--api.dashboard=true"
                - "--entrypoints.web.address=:80"
                - "--entrypoints.websecure.address=:443"
                - "--entrypoints.dashboard.address=:${DashboardPort}"
                - "--entrypoints.admin.address=:${AdminPort}"
                - "--certificatesresolvers.letsencrypt.acme.email=${AdminEmail}"
                - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
                - "--certificatesresolvers.letsencrypt.acme.caserver=ACME_SERVER_PLACEHOLDER"
                - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
                - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53"
                - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delayBeforeCheck=0"
                - "--providers.docker=true"
                - "--providers.docker.network=tt_net"
                - "--providers.docker.exposedbydefault=false"
                - "--log.level=INFO"
              ports:
                - "80:80"
                - "443:443"
                - "${DashboardPort}:${DashboardPort}"
                - "${AdminPort}:${AdminPort}"
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock:ro
                - traefik-data:/etc/traefik
              environment:
                - AWS_HOSTED_ZONE_ID=${HostedZoneId}
                - AWS_REGION=${AWS::Region}
                - AWS_SDK_LOAD_CONFIG=true
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.traefik-dashboard.rule=Host(`DOMAIN_PLACEHOLDER`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
                - "traefik.http.routers.traefik-dashboard.entrypoints=dashboard"
                - "traefik.http.routers.traefik-dashboard.service=api@internal"
                # DASHBOARD_TLS_PLACEHOLDER
            the-tubes:
              image: ${DockerImage}
              container_name: the-tubes-server
              restart: unless-stopped
              networks:
                - tt_net
              ports:
                - "${PortRangeStart}-${PortRangeEnd}:${PortRangeStart}-${PortRangeEnd}"
              volumes:
                - /opt/the-tubes/tt:/home/thetubes/.tt
              environment:
                - NODE_ENV=production
                - TT_PUBLIC_PORT=${PublicPort}
                - TT_PUBLIC_ADDRESS=0.0.0.0
                - TT_PUBLIC_DOMAIN=${ServiceName}.${DomainName}
                - TT_PUBLIC_HTTPS=${SecureTraffic}
                - TT_EXTERNAL_HTTP_PORT=80
                - TT_EXTERNAL_HTTPS_PORT=443
                - TT_API_PORT=${AdminPort}
                - TT_API_ADDRESS=0.0.0.0
                - TT_TUNNEL_PORT_START=${PortRangeStart}
                - TT_TUNNEL_PORT_END=${PortRangeEnd}
                - TT_MAX_CONNECTIONS_PER_TUNNEL=${MaxConnectionsPerTunnel}
                - TT_RECONNECT_WINDOW_MS=${ReconnectWindowMs}
                - TT_TRUST_FORWARD_HEADERS=${TrustForwardHeaders}
                - TT_HTTP_WAIT_TIMEOUT_MS=${HttpWaitTimeoutMs}
                - TT_WEBSOCKET_WAIT_TIMEOUT_MS=${WebsocketWaitTimeoutMs}
                - TT_RETRY_AFTER_SECONDS=${RetryAfterSeconds}
                - TT_HMAC_SECRET=${HmacSecret}
                - TT_HMAC_CLOCK_SKEW_TOLERANCE_S=${HmacClockSkewToleranceS}
                - TT_ADMIN_TOKEN=${AdminToken}
                - TT_RATE_LIMIT_WINDOW_MS=${RateLimitWindowMs}
                - TT_RATE_LIMIT_MAX_HITS=${RateLimitMaxHits}
                - TT_RATE_LIMIT_BLOCK_DURATION_MS=${RateLimitBlockDurationMs}
              healthcheck:
                test: ["CMD", "node", "-e", "fetch('http://localhost:${PublicPort}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
              labels:
                - "traefik.enable=true"
                # Admin API (port ${AdminPort}) - tunnel creation endpoint
                # Rule accepts both domain name and direct IP access (security enforced by Security Group)
                - "traefik.http.routers.tt-admin.rule=Host(`DOMAIN_PLACEHOLDER`)"
                - "traefik.http.routers.tt-admin.entrypoints=admin"
                - "traefik.http.routers.tt-admin.service=tt-admin-svc"
                - "traefik.http.services.tt-admin-svc.loadbalancer.server.port=${AdminPort}"
                # Public server (port 80/443) - wildcard tunnel traffic
                - "traefik.http.routers.tt-public-http.rule=HostRegexp(`^[a-zA-Z0-9-]+[.]DOMAIN_PLACEHOLDER$`)"
                - "traefik.http.routers.tt-public-http.entrypoints=web"
                - "# PUBLIC_HTTP_MIDDLEWARE_PLACEHOLDER"
                - "traefik.http.routers.tt-public-http.service=tt-public-svc"
                - "traefik.http.routers.tt-public-http.priority=10"
                - "traefik.http.services.tt-public-svc.loadbalancer.server.port=${PublicPort}"
                # Rate limiting middleware — applied to all public tunnel traffic
                - "traefik.http.middlewares.public-rl.ratelimit.average=100"
                - "traefik.http.middlewares.public-rl.ratelimit.burst=50"
                - "traefik.http.middlewares.public-rl.ratelimit.period=1m"
                - "traefik.http.middlewares.public-rl.ratelimit.sourcecriterion.ipstrategy.depth=1"
                # HTTPS labels placeholder
                - "# HTTPS_LABELS_PLACEHOLDER"
                # tt-server admin UI on dashboard port
                - "traefik.http.routers.tt-server-admin.rule=Host(`DOMAIN_PLACEHOLDER`) && PathPrefix(`/tubes`)"
                - "traefik.http.routers.tt-server-admin.entrypoints=dashboard"
                - "traefik.http.routers.tt-server-admin.service=tt-admin-svc"
                # SERVER_ADMIN_TLS_PLACEHOLDER
          networks:
            tt_net:
              name: tt_net
          volumes:
            traefik-data:
          COMPOSE_EOF

          # Conditionally add HTTPS Traefik labels and rate-limiting middlewares
          if [ "${SecureTraffic}" = "true" ]; then
            sed -i '/# PUBLIC_HTTP_MIDDLEWARE_PLACEHOLDER/c\      - "traefik.http.routers.tt-public-http.middlewares=https-redirect,public-rl"' docker-compose.yml
            sed -i '/# HTTPS_LABELS_PLACEHOLDER/c\      - "traefik.http.routers.tt-admin.tls=true"\n      - "traefik.http.routers.tt-admin.tls.certresolver=letsencrypt"\n      - "traefik.http.routers.tt-public.rule=HostRegexp(`^[a-zA-Z0-9-]+[.]DOMAIN_PLACEHOLDER$`)"\n      - "traefik.http.routers.tt-public.entrypoints=websecure"\n      - "traefik.http.routers.tt-public.middlewares=public-rl"\n      - "traefik.http.routers.tt-public.service=tt-public-svc"\n      - "traefik.http.routers.tt-public.tls=true"\n      - "traefik.http.routers.tt-public.tls.certresolver=letsencrypt"\n      - "traefik.http.routers.tt-public.tls.domains[0].main=DOMAIN_PLACEHOLDER"\n      - "traefik.http.routers.tt-public.tls.domains[0].sans=*.DOMAIN_PLACEHOLDER"\n      - "traefik.http.routers.tt-public.priority=10"\n      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"\n      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"' docker-compose.yml
            sed -i '/# DASHBOARD_TLS_PLACEHOLDER/c\      - "traefik.http.routers.traefik-dashboard.tls=true"\n      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"' docker-compose.yml
            sed -i '/# SERVER_ADMIN_TLS_PLACEHOLDER/c\      - "traefik.http.routers.tt-server-admin.tls=true"\n      - "traefik.http.routers.tt-server-admin.tls.certresolver=letsencrypt"' docker-compose.yml
          else
            sed -i '/# PUBLIC_HTTP_MIDDLEWARE_PLACEHOLDER/c\      - "traefik.http.routers.tt-public-http.middlewares=public-rl"' docker-compose.yml
            sed -i '/# HTTPS_LABELS_PLACEHOLDER/d' docker-compose.yml
            sed -i '/# DASHBOARD_TLS_PLACEHOLDER/d' docker-compose.yml
            sed -i '/# SERVER_ADMIN_TLS_PLACEHOLDER/d' docker-compose.yml
          fi

          # Replace runtime placeholders with actual values
          sed -i "s|ACME_SERVER_PLACEHOLDER|$ACME_SERVER|g" docker-compose.yml
          sed -i "s/DOMAIN_PLACEHOLDER/$CUSTOM_DOMAIN/g" docker-compose.yml

          # Pull Docker images and start containers
          docker pull traefik:v3.6.13
          docker pull ${DockerImage}
          docker-compose up -d
          sleep 60

          # Signal CloudFormation
          if docker ps | grep -q "traefik" && docker ps | grep -q "the-tubes-server"; then
            /usr/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource TheTubesInstance --region ${AWS::Region}
          else
            /usr/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource TheTubesInstance --region ${AWS::Region}
            exit 1
          fi

          echo "done"
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-the-tubes-instance'

  TheTubesDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${ServiceName}.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords:
        - !If [ShouldCreateInstance, !GetAtt TheTubesInstance.PublicIp, "192.0.2.1"]

  TheTubesWildcardDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '*.${ServiceName}.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords:
        - !If [ShouldCreateInstance, !GetAtt TheTubesInstance.PublicIp, "192.0.2.1"]

Outputs:
  InstanceId:
    Condition: ShouldCreateInstance
    Description: EC2 Instance ID
    Value: !Ref TheTubesInstance
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId'

  PublicIp:
    Condition: ShouldCreateInstance
    Description: Public IP Address
    Value: !GetAtt TheTubesInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-PublicIp'

  PublicDnsName:
    Condition: ShouldCreateInstance
    Description: Public DNS Name
    Value: !GetAtt TheTubesInstance.PublicDnsName
    Export:
      Name: !Sub '${AWS::StackName}-PublicDnsName'

  TheTubesDomain:
    Description: The Tubes API domain (tunnel creation endpoint)
    Value: !Sub '${ServiceName}.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-TheTubesDomain'

  TheTubesWildcardDomain:
    Description: Wildcard domain for public tunnel subdomains (unrestricted inbound)
    Value: !Sub '*.${ServiceName}.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-TheTubesWildcardDomain'

  AdminApiUrl:
    Description: Admin API base URL for tunnel management - POST /api/tunnels (restricted by Security Group)
    Value: !If
      - IsSecureTraffic
      - !Sub 'https://${ServiceName}.${DomainName}:${AdminPort}'
      - !Sub 'http://${ServiceName}.${DomainName}:${AdminPort}'
    Export:
      Name: !Sub '${AWS::StackName}-AdminApiUrl'

  ClientPortRange:
    Description: TCP port range reserved for expose client persistent connections
    Value: !Sub '${PortRangeStart}-${PortRangeEnd}'
    Export:
      Name: !Sub '${AWS::StackName}-ClientPortRange'

  TraefikDashboard:
    Description: Traefik Dashboard URL (restricted by Security Group)
    Value: !If
      - IsSecureTraffic
      - !Sub 'https://${ServiceName}.${DomainName}:${DashboardPort}/dashboard/'
      - !Sub 'http://${ServiceName}.${DomainName}:${DashboardPort}/dashboard/'
    Export:
      Name: !Sub '${AWS::StackName}-TraefikDashboard'

  TheTubesServerAdminUrl:
    Description: tt-server admin dashboard URL (restricted by Security Group)
    Value: !If
      - IsSecureTraffic
      - !Sub 'https://${ServiceName}.${DomainName}:${DashboardPort}/tubes'
      - !Sub 'http://${ServiceName}.${DomainName}:${DashboardPort}/tubes'
    Export:
      Name: !Sub '${AWS::StackName}-TheTubesServerAdminUrl'

  TraefikDashboardNote:
    Condition: ShouldCreateInstance
    Description: Dashboard access instructions
    Value: !If
      - IsSecureTraffic
      - !Sub 'Traefik dashboard: https://${ServiceName}.${DomainName}:${DashboardPort}/dashboard/ | tt-server admin: https://${ServiceName}.${DomainName}:${DashboardPort}/tubes'
      - !Sub 'Traefik dashboard: http://${TheTubesInstance.PublicIp}:${DashboardPort}/dashboard/ | tt-server admin: http://${TheTubesInstance.PublicIp}:${DashboardPort}/tubes'
    Export:
      Name: !Sub '${AWS::StackName}-TraefikDashboardNote'

  TheTubesClientCommand:
    Description: Command to expose a local port through The Tubes (run from allowed IPs)
    Value: !If
      - IsSecureTraffic
      - !Sub 'tt expose --server-url https://${ServiceName}.${DomainName}:${AdminPort} --local-port YOUR_LOCAL_PORT'
      - !Sub 'tt expose --server-url http://${ServiceName}.${DomainName}:${AdminPort} --local-port YOUR_LOCAL_PORT'
    Export:
      Name: !Sub '${AWS::StackName}-TheTubesClientCommand'

  ExamplePublicSubdomain:
    Description: Example of a public tunnel subdomain (accessible from anywhere)
    Value: !If
      - IsSecureTraffic
      - !Sub 'https://myapp.${ServiceName}.${DomainName}'
      - !Sub 'http://myapp.${ServiceName}.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-ExamplePublicSubdomain'

  SecurityNote:
    Description: Security configuration details
    Value: !Sub 'Port ${DashboardPort} (Traefik /dashboard and tt-server /tubes), ${AdminPort} (admin API) and ${PortRangeStart}-${PortRangeEnd} (expose client TCP) are initially restricted to 127.0.0.1/32. Update Security Group "${AWS::StackName}-tt-client-sg" manually to allow your IPs. Ports 80/443 are open for wildcard tunnel subdomains (IPv4+IPv6). Traefik rate limiting: 100 req/min avg, burst 50. In-process rate limiting: ${RateLimitMaxHits} hits/${RateLimitWindowMs}ms then ${RateLimitBlockDurationMs}ms block.'
    Export:
      Name: !Sub '${AWS::StackName}-SecurityNote'

  AdminTokenNote:
    Description: Admin dashboard token information
    Value: !If
      - AdminTokenProvided
      - 'Admin token was set via AdminToken parameter (saved to /opt/the-tubes/tt/admin-token). Use X-TT-Admin-Token header to authenticate.'
      - !Sub 'Admin token will be auto-generated on first start and saved to /opt/the-tubes/tt/admin-token. Check container logs for the token, or SSH to the instance and run: cat /opt/the-tubes/tt/admin-token'
    Export:
      Name: !Sub '${AWS::StackName}-AdminTokenNote'

  SecurityGroupId:
    Description: Security Group ID for expose client and admin access - update ingress rules manually to allow your IPs
    Value: !Ref TheTubesClientSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'

  SecurityGroupName:
    Description: Security Group Name for easy identification in AWS Console
    Value: !Sub '${AWS::StackName}-tt-client-sg'
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupName'

  SSLInfo:
    Description: SSL Certificate Information
    Value: !If
      - IsSecureTraffic
      - 'Wildcard SSL enabled via DNS-01 challenge for public tunnel subdomains, admin API, and admin dashboards (all HTTPS)'
      - 'SSL disabled - all traffic is plain HTTP'
    Export:
      Name: !Sub '${AWS::StackName}-SSLInfo'

  LetsEncryptEnvironment:
    Description: Lets Encrypt environment being used
    Value: !Ref LetsEncryptEnvironment
    Export:
      Name: !Sub '${AWS::StackName}-LetsEncryptEnvironment'

  ChallengeType:
    Description: ACME challenge type being used
    Value: DNS-01 with Route53
    Export:
      Name: !Sub '${AWS::StackName}-ChallengeType'

  ProvisioningStatus:
    Condition: ShouldCreateInstance
    Description: Instance provisioning completed successfully
    Value: SUCCESS - All services running with wildcard SSL, client IP restrictions, and secure dashboard
    Export:
      Name: !Sub '${AWS::StackName}-ProvisioningStatus'

  HmacAuthenticationStatus:
    Description: HMAC Authentication status
    Value: !If
      - HmacEnabled
      - 'ENABLED - HMAC-SHA256 authentication required for tunnel creation (POST /api/tunnels)'
      - 'DISABLED - No HMAC authentication, any client that can reach the Admin API may create tunnels'
    Export:
      Name: !Sub '${AWS::StackName}-HmacAuthenticationStatus'

  HmacSecurityNote:
    Description: HMAC Authentication security information
    Value: !If
      - HmacEnabled
      - !Sub 'HMAC enabled. Clock skew tolerance: ${HmacClockSkewToleranceS}s - nonce max age = 2x tolerance, nonce cache TTL = 4x tolerance. Expose clients must set TT_HMAC_SECRET to the same value and send X-TT-Auth, X-Timestamp, and X-Nonce headers. See docs/SECURITY.md.'
      - 'HMAC authentication disabled. To enable, redeploy with HmacSecret set to a value of at least 32 characters (generate with: openssl rand -hex 32). Expose clients must set TT_HMAC_SECRET to the same value.'
    Export:
      Name: !Sub '${AWS::StackName}-HmacSecurityNote'
